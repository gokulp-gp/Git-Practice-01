<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>My Bio</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f4f4;
      margin: 0;
      padding: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .card {
      background: white;
      padding: 25px;
      border-radius: 12px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
      max-width: 400px;
      text-align: center;
    }

    h1 {
      margin-bottom: 10px;
      color: #333;
    }

    p {
      color: #666;
      line-height: 1.5;
    }

    .tag {
      display: inline-block;
      margin-top: 10px;
      padding: 5px 10px;
      background: #007bff;
      color: white;
      border-radius: 20px;
      font-size: 12px;
    }
  </style>
</head>

<body>

  <div class="card">
    <h1>Gokul P</h1>
    <p>
      Aspiring DevOps Engineer passionate about Linux, Git, Docker, and cloud technologies.
      I enjoy building efficient systems and learning new technologies every day.
    </p>

    <div class="tag">DevOps Learner</div>
  </div>

</body>
</html>
